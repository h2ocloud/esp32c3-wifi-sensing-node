# secrets.example.yaml — 範本（假值）。複製成 secrets.yaml 再填自己的值：
#   cp secrets.example.yaml secrets.yaml
# secrets.yaml 已列在 .gitignore，不會進版控。不要把真的帳密 commit 到任何地方。
# Template only (fake values). Copy to secrets.yaml and fill in your own.

# Wi-Fi（ESP32-C3 只支援 2.4 GHz）
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# 連不上 Wi-Fi 時的設定用 AP 密碼（至少 8 字元）
fallback_ap_password: "CHANGE_ME_AP_PASS"

# Home Assistant API 金鑰不放這裡：wifi-node.yaml 用執行期佈建（第一次配對時產生）。

# OTA 更新密碼
ota_password: "CHANGE_ME_OTA_PASS"

# --- 選配：packages/csi-ping-target.yaml ---
# CSI 流量的 ping 目標。預設不用設（ping 預設閘道）。
# 要改 ping 某台一直開著的主機時填它的 IPv4。
# 192.0.2.1 是 RFC 5737 文件專用位址（不會有人回應），只是佔位，請換成你自己的。
csi_ping_target: "192.0.2.1"

# --- 選配：packages/mqtt.yaml ---
# broker 位址請填你自己的（佔位用 example.com 網域）。
mqtt_broker: "mqtt.example.com"
mqtt_username: "YOUR_MQTT_USER"
mqtt_password: "YOUR_MQTT_PASSWORD"

# --- 選配：web_server 帳密（wifi-node.yaml 的 auth 區段）---
web_username: "YOUR_WEB_USER"
web_password: "YOUR_WEB_PASSWORD"
