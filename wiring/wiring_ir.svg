<text x="1870" y="1212" font-size="22" font-weight="400" fill="#4f5963" text-anchor="middle" >TO-92：平面朝自己、腳朝下，由左到右</text>
<text x="2256" y="940" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle" >VS1838B</text>
