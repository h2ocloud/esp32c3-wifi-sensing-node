<text x="70" y="1108" font-size="22" font-weight="400" fill="#4f5963" text-anchor="start" >電阻選擇：33 Ω 放在 5V 與 LED 陽極之間（電阻就在 5V 路徑上）</text>
<text x="70" y="1148" font-size="22" font-weight="400" fill="#4f5963" text-anchor="start" >LED 從 USB 5V 供電；GPIO3 只推電晶體基極（約 2.6 mA）</text>
