<text x="1664" y="498" font-size="24" font-weight="700" fill="#c92a2a" text-anchor="start" >→ 3V3（右排 #3）</text>
<text x="1250" y="606" font-size="22" font-weight="400" fill="#1a1a1a" text-anchor="start" >• VCC 接 3V3、不接 5V：OUT 才不會超過 3.3 V</text>
<text x="1250" y="648" font-size="22" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 38 kHz；輸出低電位有效（ESPHome 設 inverted: true）</text>
<text x="1250" y="690" font-size="22" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 避開陽光／日光燈直射（會誤觸）；離 IR LED 遠一點或加遮擋，免得收到自己發的訊號</text>
<text x="1250" y="732" font-size="22" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 常見腳序 OUT-GND-VCC（面對圓頂、腳朝下由左到右），以實物為準</text>
