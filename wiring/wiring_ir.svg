<text x="1494" y="478" font-size="22" font-weight="700" fill="#495057" text-anchor="start" >VCC</text>
<path d="M1480,490 L1640,490" fill="none" stroke="#141414" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path class="wire" data-net="rx-VCC" d="M1480,490 L1640,490" fill="none" stroke="#e03131" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
