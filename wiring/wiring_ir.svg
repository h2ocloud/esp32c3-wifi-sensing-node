<line x1="2320" y1="1054" x2="2320" y2="1140" stroke="#868e96" stroke-width="6" stroke-linecap="round" />
<text x="2320" y="1174" font-size="22" font-weight="700" fill="#c92a2a" text-anchor="middle" >VCC</text>
<rect x="40" y="1262" width="2320" height="600" rx="14" fill="#f8f9fa" stroke="#ced4da" stroke-width="2" />
<text x="70" y="1312" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="start" >D. IR LED 驅動計算（細節與來源見 PINMAP.md）</text>
<text x="70" y="1368" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 限流電阻：R = (Vbus − Vf − Vce(sat)) ÷ If = (5.0 − 1.35 − 0.25) ÷ 0.10 ≈ 34 Ω → 取 33 Ω（E12）</text>
<text x="70" y="1426" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• LED 電流：If = (5.0 − Vf − 0.25) ÷ 33 Ω；Vf 1.2 V → 約 108 mA、1.35 V → 約 103 mA、1.4 V → 約 102 mA</text>
<text x="70" y="1484" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 電阻功率：峰值 I²R ≈ 0.103² × 33 ≈ 0.35 W；38 kHz 載波約 50% × 協定 mark 約 50% → 平均約 0.09 W，每次發送約 0.1–0.5 s，1/4 W 足夠</text>
<text x="70" y="1542" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 基極：Ib = (3.3 − 0.7) ÷ 1 kΩ ≈ 2.6 mA，強制 β ≈ 103 ÷ 2.6 ≈ 40；S8050 在 100 mA 的最小 hFE 為 85（onsemi SS8050）→ 確實飽和</text>
<text x="70" y="1600" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 改用 2N2222／PN2222A：150 mA、VCE = 1 V 的最小 hFE 是 50，餘裕較小；要更穩可把 1 kΩ 改 680 Ω（Ib ≈ 3.8 mA）</text>
<text x="70" y="1658" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 不用 GPIO 直驅：ESP32-C3 單腳 IOH 典型 40 mA、IOL 28 mA（datasheet 表 5-4），遠低於 100 mA</text>
<text x="70" y="1716" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 不從 3V3 供電：扣掉 Vf、Vce 後餘裕小，電流對 Vf 很敏感；100 mA 脈衝還會和 Wi-Fi 發射尖峰（最高 335 mA）共用板上 ME6211（500 mA）</text>
<text x="70" y="1774" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• LED 型號未確認：實物 datasheet 的連續／脈衝電流上限若低於 100 mA，改用 47–68 Ω</text>
<text x="70" y="1832" font-size="23" font-weight="400" fill="#1a1a1a" text-anchor="start" >• 故障情況：GPIO3 若一直維持高電位，LED 會持續約 103 mA、33 Ω 持續約 0.35 W（超過 1/4 W）→ 韌體閒置須為低電位；要更保險可用 1/2 W</text>
<text x="2360" y="1888" font-size="22" font-weight="400" fill="#4f5963" text-anchor="end" >板圖自繪，CC0-1.0</text>
