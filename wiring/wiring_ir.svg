<title>紅外線電路放大圖</title>
<desc>GPIO3 經 1 kΩ 驅動 NPN（S8050 或 2N2222），5V 經 33 Ω 與 940 nm IR LED 到集極；VS1838B 接收頭（必備）接 GPIO10。用於紅外線控制日立（Hitachi）冷氣（遙控器 RF11T1）。零件圖自繪，CC0-1.0。</desc>
<defs><pattern id="hatchAvoid" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#c7ccd1"/><rect width="4" height="10" fill="#6c757d"/></pattern><pattern id="hatchKeep" patternUnits="userSpaceOnUse" width="22" height="22" patternTransform="rotate(45)"><rect width="22" height="22" fill="#fff5f5"/><rect width="6" height="22" fill="#ffc9c9"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrowIR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker></defs>
<rect x="0" y="0" width="2400" height="1910" fill="#ffffff"/>
<text x="40" y="66" font-size="40" font-weight="700" fill="#1a1a1a" text-anchor="start" >紅外線電路放大圖｜紅外線控制日立（Hitachi）冷氣（遙控器 RF11T1）</text>
<text x="40" y="112" font-size="26" font-weight="400" fill="#4f5963" text-anchor="start" >分接／IR 驅動小板照這張焊；腳位都以 ESP32-C3 SuperMini 元件面朝上、USB-C 朝上的位置標示。</text>
<rect x="40" y="150" width="1140" height="1060" rx="14" fill="#fbfbfc" stroke="#ced4da" stroke-width="2" />
<text x="70" y="200" font-size="28" font-weight="700" fill="#1a1a1a" text-anchor="start" >A. IR 發射驅動（GPIO3 → NPN → 940 nm IR LED）</text>
<circle cx="780" cy="262" r="12" fill="#f76707" stroke="#1a1a1a" stroke-width="3" />
<text x="808" y="271" font-size="26" font-weight="700" fill="#c2410c" text-anchor="start" >5V（C3 右排 #1，USB VBUS）</text>
